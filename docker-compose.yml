name: microservices-lab

services:

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  estoque-db:
    image: postgres:16
    environment:
      POSTGRES_DB: estoque
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: estoque
    volumes:
      - estoque-data:/var/lib/postgresql/data
      - ./estoque-service/estoque-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque -d estoque"]
      interval: 5s
      timeout: 3s
      retries: 10

  pedido-db:
    image: postgres:16
    environment:
      POSTGRES_DB: pedido
      POSTGRES_USER: pedido
      POSTGRES_PASSWORD: pedido
    volumes:
      - pedido-data:/var/lib/postgresql/data
      - ./pedido-service/pedido-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedido -d pedido"]
      interval: 5s
      timeout: 3s
      retries: 10

  pagamento-db:
    image: postgres:16
    environment:
      POSTGRES_DB: pagamento
      POSTGRES_USER: pagamento
      POSTGRES_PASSWORD: pagamento
    volumes:
      - pagamento-data:/var/lib/postgresql/data
      - ./pagamento-service/pagamento-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagamento -d pagamento"]
      interval: 5s
      timeout: 3s
      retries: 10

  estoque-service:
    build: ./estoque-service
    ports:
      - "8081:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://estoque:estoque@estoque-db:5432/estoque
    depends_on:
      estoque-db:
        condition: service_healthy

  pedido-service:
    build: ./pedido-service
    ports:
      - "8080:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://pedido:pedido@pedido-db:5432/pedido
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      ESTOQUE_SERVICE_URL: http://estoque-service:8000
      SIMULAR_FALHA_APOS_RESERVA: ${SIMULAR_FALHA_APOS_RESERVA:-false}
      COMPENSACAO_HABILITADA: ${COMPENSACAO_HABILITADA:-true}
    depends_on:
      pedido-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      estoque-service:
        condition: service_started

  pagamento-service:
    build: ./pagamento-service
    environment:
      DATABASE_URL: postgresql+psycopg://pagamento:pagamento@pagamento-db:5432/pagamento
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PAGAMENTO_FALHAR_PEDIDO_ID: ${PAGAMENTO_FALHAR_PEDIDO_ID:-}
    depends_on:
      pagamento-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  estoque-data:
  pedido-data:
  pagamento-data:
